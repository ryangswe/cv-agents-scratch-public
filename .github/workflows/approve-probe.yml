# A probe, not a pattern to copy: it hands a PR run a token that can write to pull requests. The
# repo setting "Allow GitHub Actions to create and approve pull requests" is off, so its approval
# must be refused. Phase 1 reads the result from the run's log and the PR's reviews.
name: approve-probe

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: gh pr review "$PR" --approve --body "approve-probe: GITHUB_TOKEN tries to approve" -R "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
